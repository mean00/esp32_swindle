[package]
name = "app"
version = "0.1.0"
authors = ["mean <fixounet@free.fr>"]
edition = "2024"
#rust-version = "1.77"

[[bin]]
name = "swindle_s3"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors
path = "src/main.rs"

# Extra IDF components for the esp-idf-sys build (network_provisioning + cjson,
# vendored under the workspace root's components/; IDF 6.0 dropped the core
# wifi_provisioning/json components). Relative paths resolve against THIS
# manifest's folder, so "../components" is relocatable. NOTE: serde field names
# are used verbatim (no kebab-case) — `extra_components` / `component_dirs`.
[package.metadata.esp-idf-sys]
extra_components = [{ component_dirs = "../components" }]

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

experimental = ["esp-idf-svc/experimental"]

[dependencies]
libc = "0.2.182"
log = "0.4.29"
esp-idf-svc = {workspace = true }
esp-idf-sys = {workspace = true }
esp-idf-hal = {workspace = true }
num-traits = "0.2.19"
num-derive = "0.4.2"
anyhow = "1.0.102"
rsbmp ={ workspace = true } #package="rsbmp", path = "../modules/swindle/swindle/rs/rs_swindle", features = ["std","esp32"]}
heapless = "0.9.2"
rust-sfsm  = { version = "1.0.0", default-features = false}
lazy_static = { version = "1.5.0"}

# Link-time ordering deps: these crates' build scripts compile and install
# libswindle_single.a, libesprit_single_lib.a and libesp32_ws2812.a into
# target/<triple>/<profile>/build/native/lib. Depending on them makes cargo
# build the C/C++ libs before swindle_s3 links and relink the binary whenever
# build_all.sh switches SIZE or RESET polarity (SWINDLE_SIZE/SWINDLE_NRST
# trigger their build scripts to re-run, which invalidates app's fingerprint).
native_code = { path = "../native_code" }
extra_code = { path = "../extra_code" }


[build-dependencies]
embuild = "0.33.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(esp32c3)','cfg(esp32c6)','cfg(esp32s3)'] }
