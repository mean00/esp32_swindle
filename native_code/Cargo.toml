[package]
name = "native_code"
version = "0.1.0"
authors = ["mean <fixounet@free.fr>"]
edition = "2024"
#rust-version = "1.77"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "z"

[features]
default = []

[lib]
name = "native_code" 
path = "src/lib.rs"

# Extra IDF components for the esp-idf-sys build (network_provisioning + cjson,
# vendored under the workspace root's components/). Relative paths resolve
# against THIS manifest's folder, so "../components" is relocatable. NOTE:
# serde field names are used verbatim — `extra_components` / `component_dirs`.
[package.metadata.esp-idf-sys]
extra_components = [{ component_dirs = "../components" }]

#experimental = ["esp-idf-svc/experimental"]

[dependencies]
esp-idf-sys = {workspace = true }

[build-dependencies]
cmake = "0.1"


